<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plexiptv</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='17' rx='3' fill='%23e5a00d'/%3E%3Crect x='11' y='26' width='10' height='2' rx='1' fill='%23e5a00d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form" class="card">
    <h1>plexiptv</h1>
    <p id="login-msg" class="muted"></p>
    <input id="login-pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="primary" type="submit" id="login-btn">Log in</button>
    <p id="login-err" class="error"></p>
  </form>
</div>

<div id="shell" class="hidden">
  <header>
    <div class="brand">plexiptv</div>
    <nav id="tabs">
      <a data-tab="dashboard">Dashboard</a>
      <a data-tab="channels">Channels</a>
      <a data-tab="groups">Groups</a>
      <a data-tab="rules">Rules</a>
      <a data-tab="sources">Sources</a>
      <a data-tab="devices">Tuners</a>
      <a data-tab="streams">Streams</a>
      <a data-tab="logs">Logs</a>
      <a data-tab="settings">Settings</a>
    </nav>
  </header>
  <main id="view"></main>
</div>

<dialog id="player" class="player"></dialog>
<dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
